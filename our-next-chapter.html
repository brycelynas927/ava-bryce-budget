.home-photo-banner strong{font:italic 22px Georgia,serif;font-weight:400;display:block;text-shadow:0 1px 6px #2424244d}
.home-photo-banner small{display:block;max-width:70%;font-size:10px;margin-top:6px;line-height:1.45;color:#fff9f3}
.stats-ring{height:87px;width:87px;flex:0 0 87px;border-radius:50%;display:grid;place-items:center;position:relative}.stats-ring:before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--paper)}.stats-ring .ring-center{position:relative;text-align:center;line-height:1.18}.ring-center strong{display:block;font-size:16px;color:#315d4e}.ring-center small{font-size:8px;color:#7e857c}
.pay-stat-row{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:9px 0 6px}.pay-stat-row .pay-stat{flex:1;min-width:0}.pay-stat strong{font-size:25px;letter-spacing:-.9px;display:block;line-height:1.12}.pay-stat small{font-size:10px;color:#868c84;line-height:1.25;display:block;margin-top:3px}
.pay-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:9px 0}.pay-breakdown>div{min-width:0;border-radius:12px;padding:9px 6px;text-align:center;background:#f3eee8}.pay-breakdown>div:nth-child(2){background:#f8e9e5}.pay-breakdown>div:nth-child(3){background:#e7f1e7}.pay-breakdown strong{font-size:15px;display:block;white-space:nowrap}.pay-breakdown small{font-size:9px;display:block;color:#797f77;line-height:1.3}
.bill-summary{display:flex;justify-content:space-between;align-items:center;background:#f9eae7;padding:11px 13px;border-radius:15px;margin-bottom:8px;gap:10px}.bill-summary small{display:block;color:#986b64;font-size:10px}.bill-summary strong{font-size:17px;color:#865f55}
.goal-strip{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.goal-small{border:1px solid #f3eae0;background:var(--paper);border-radius:15px;padding:11px 10px;text-align:left;box-shadow:var(--shadow);overflow:hidden;position:relative}.goal-small .goal-title{font-size:11px;font-weight:750;display:block;margin:4px 0 2px}.goal-small .goal-money{font-size:10px;color:#808a82;display:block;white-space:nowrap}.goal-small .meter{height:6px;margin-top:9px}.goal-small .tiny-art{display:flex;justify-content:space-between;align-items:center}.goal-small .emoji{font-size:20px;display:grid;place-items:center;background:#ecf0e8;border-radius:10px;width:37px;height:37px}.goal-small:nth-child(2) .emoji{background:#f7e8e2}.goal-small:nth-child(3) .emoji{background:#e8eff5}.goal-small:nth-child(4) .emoji{background:#eef1df}
.bottom{grid-template-columns:repeat(5,1fr);box-shadow:0 -3px 15px #695d4d14;background:#fffcf6f0;border-color:#eee4d8}.tab{font-size:10px;color:#757e75;gap:2px}.tab .ico{display:grid;place-items:center;height:26px;line-height:25px}.tab.active .ico{padding:0 8px;background:#e4f0e8;color:#236a54}.tab svg{height:21px;width:21px;stroke:currentColor;stroke-width:1.85;fill:none;stroke-linecap:round;stroke-linejoin:round}

 '<div class="help">No money moves until you actually transfer or spend it. Confirm bills and card minimums before finalizing.</div>';
}

else if(modal==='addbill'){const preset=billPresets.find(x=>x.key===modalArgs.templateKey)||billPresets.find(x=>x.key==='custom');title='Add a bill, the easy way';html=`<div class="help">Choose something from your original budget. Then check the amount and due date; they are only estimates until you confirm.</div>${billPresetButtons()}<div class="preset-edit">${field('Bill',input('name',preset.key==='custom'?'':preset.name,'text','required placeholder="Bill name"'))}<div class="field-inline">${field('Amount ($)',input('amount',preset.amount||'','number','min="0" step="0.01" required'))}${field('Due day',input('day',preset.day,'number','min="1" max="31" required'))}</div><label class="switchline">I have confirmed this due date <input type="checkbox" name="confirmed"></label><div class="small muted" style="margin-top:7px">Make sure you aren't counting the same bill twice. Food and gas are normally included in joint everyday spending.</div></div>`}
else if(['addincome','addexpense','addpayment','addsaving'].includes(modal)){title=({addincome:'Record income',addexpense:'Record an expense',addpayment:'Log a debt payment',addsaving:'Move money to a goal'})[modal];const options=modal==='addpayment'?state.debts.map(d=>[d.id,`${d.name} · ${money(debtBalance(d))} left`]):state.goals.map(g=>[g.id,g.name]);html=`${modal==='addpayment'||modal==='addsaving'?field(modal==='addpayment'?'Debt account':'Savings goal',sel('ref',options,modalArgs.id||'')):field('Description',input('name',modal==='addincome'?'Paycheque':modal==='addexpense'?'Purchase':'','text','required'))}${field('Amount ($)',input('amount','','number','min="0.01" step="0.01" required'))}${modal==='addincome'?field('Income source',sel('source',[['paycheck','Paycheque'],['uber','Uber / deliveries'],['resell','Online reselling'],['side','Other side jobs'],['other','Other']])):modal==='addexpense'?field('Expense category',sel('source',[['living','Regular living expenses'],['uber','Uber / delivery costs'],['resell','Reselling inventory or fees'],['other','Other']])):''}${field('Date',input('date',today(),'date','required'))}${modal==='addsaving'?field('Direction',sel('direction',[['goal','Add savings'],['withdraw','Use/withdraw goal money']])):''}${field('Optional note',input('note','','text','placeholder="What was this for?"'))}<div class="help">Only record a real transaction. Plans live separately in Pay Period Planner.</div>`;button='Record'}
else if(modal==='addallocation'){title='Assign money for this period';html=`${field('Plan this money for',sel('ref',[...state.goals.map(g=>[g.id,'Goal · '+g.name]),...state.debts.map(d=>[d.id,'Debt · '+d.name])]))}${field('Amount ($)',input('amount','','number','min="0.01" step="0.01" required'))}<div class="help">This is a plan only; it doesn't change balances until you record a real payment.</div>`;button='Assign money'}
else if(modal==='goaldetail'){const g=state.goals.find(x=>x.id===modalArgs.id);if(!g)return;title=g.name;html=`<div class="info-card">${esc(g.icon)} Saved so far: <strong>${money(g.saved)}</strong>${g.target?' of '+money(g.target):''}</div>${field('Goal name',input('name',g.name,'text','required'))}${field('Target amount ($)',input('target',g.target,'number','min="0" step="1" required'))}${field('Target date (optional)',input('deadline',g.deadline||'','date'))}<div class="mini-actions" style="margin:12px 0"><button type="button" class="solid" data-action="addsaving" data-id="${g.id}">+ Add or use savings</button></div>`}
else if(modal==='debtdetail'){const d=getDebt(modalArgs.id);if(!d)return;title=d.name;html=`<div class="info-card">Current recorded balance: <strong>${money(debtBalance(d))}</strong><br>Payments since tracking began: ${money(debtPaid(d.id))}</div>${field('Correct current balance to match statement ($)',input('balance',debtBalance(d),'number','min="0" step="0.01" required'))}<div class="help">Use this if your statement includes interest, fees or earlier payments. Payments you've recorded stay in history.</div><button type="button" class="outline full" data-action="addpayment" data-id="${d.id}">Log a payment instead</button>`}
else if(modal==='addevent'){title='Add a life event';html=`${field('Event name',input('name','','text','required'))}${field('Date',input('date',selectedDate||today(),'date','required'))}${field('Notes',input('note','','text'))}`}
else{return}
$('#modal-root').innerHTML=`<div class="overlay" data-close-overlay="1"><div class="sheet"><div class="sheethead"><h2>${esc(title)}</h2><button type="button" data-action="closemodal">×</button></div><form id="modalform" data-form="${action}">${html}<button type="submit" class="solid full" style="margin-top:16px">${button}</button></form></div></div>`;
}
function onSubmit(e){e.preventDefault();let f=e.target,m=f.dataset.form,data=Object.fromEntries(new FormData(f).entries()),amount=Number(data.amount||0),date=data.date||today();
if(m==='jointbreakdown'){closeModal();return}
if(m==='rentcash'){const c=getCycle();state.rentWithdrawals??=[];if(!rentWithdrawalFor(c.key)){if(!(amount>0)||!date){showToast('Enter the cash amount and date');return}state.rentWithdrawals.push({id:uid(),periodKey:c.key,date,amount});showToast('Cash withdrawal recorded ✓')}else showToast('Already recorded for this pay period');save();closeModal();render();return}
if(m==='editcycle'){state.cycleAnchor=data.anchor;state.expectedIncome=Number(data.income);state.expectedEssentials=Number(data.essentials);cycleOffset=0;showToast('Pay period settings saved')}
else if(m==='editreserves'){['savings','rent','cash','rrsp'].forEach(k=>state.reserves[k]=Number(data[k]));state.reserves.rentSeparateUnconfirmed=!f.elements.separate.checked;showToast('Snapshot updated')}
else if(m==='editperiodplan'){const key=getCycle().key;state.periodConfigs??={};state.periodConfigs[key]={income:Number(data.income),rent:Number(data.rent),reserved:Number(data.reserved),groceries:Number(data.groceries),gas:Number(data.gas),cats:Number(data.cats),otherEssentials:Number(data.otherEssentials),personal:Number(data.personal),credit:Number(data.credit),cars:Number(data.cars)};const v=periodFinances(getCycle());showToast(v.left<0?'Saved · review your shortfall':'Two-week plan saved ✓')}
else if(m==='addbill'){const name=data.name.trim();const duplicate=state.bills.find(b=>b.active&&b.name.trim().toLowerCase()===name.toLowerCase());if(duplicate){showToast('This bill already exists. Edit the existing one instead.');return}const preset=billPresets.find(x=>x.key===modalArgs.templateKey);state.bills.push({id:uid(),name,amount,day:Number(data.day),confirmed:!!f.elements.confirmed.checked,icon:preset?.icon||'🧾',active:true});showToast('Bill added · date can be edited later')}
else if(m==='billdetail'){let b=state.bills.find(x=>x.id===modalArgs.id);b.name=data.name.trim();b.amount=amount;b.day=Number(data.day);b.confirmed=f.elements.confirmed.checked;showToast('Bill updated')}
else if(['addincome','addexpense','addpayment','addsaving'].includes(m)){if(!amount||amount<=0){showToast('Enter an amount above zero');return}let type=m==='addincome'?'income':m==='addexpense'?'expense':m==='addpayment'?'debt':data.direction;let ref=data.ref||'';if(type==='debt'&&amount>debtBalance(getDebt(ref))){showToast('Payment is larger than the balance remaining');return}if(type==='withdraw'){let g=state.goals.find(x=>x.id===ref);if(amount>g.saved){showToast('Withdrawal is larger than this goal balance');return}g.saved-=amount}else if(type==='goal'){state.goals.find(x=>x.id===ref).saved+=amount}
const name=data.name|| (type==='debt'?getDebt(ref).name:state.goals.find(g=>g.id===ref)?.name)||'Transaction';state.transactions.push({id:uid(),type,ref,amount,date,name,note:data.note||'',source:data.source||''});showToast('Recorded successfully ✓');if(type==='debt')maybeCelebrate(getDebt(ref));if(type==='goal'){const g=state.goals.find(x=>x.id===ref);state.goalCelebrated??={};if(g.target&&g.saved>=g.target&&!state.goalCelebrated[ref]){state.goalCelebrated[ref]=true;pendingCelebration=['A goal reached!','You saved enough for '+g.name+' 🎉','🌴']}}}
else if(m==='addallocation'){if(amount<=0){showToast('Enter an amount above zero');return}const key=getCycle().key,ref=data.ref,fromGoal=state.goals.find(g=>g.id===ref),fromDebt=getDebt(ref);state.plan[key]??=[];state.plan[key].push({id:uid(),ref,name:fromGoal?.name||fromDebt?.name||'Goal',amount,type:fromGoal?'goal':'debt'});showToast('Assigned in your plan—not yet spent')}
else if(m==='goaldetail'){let g=state.goals.find(x=>x.id===modalArgs.id);g.name=data.name.trim();g.target=Number(data.target);g.deadline=data.deadline||'';showToast('Goal updated')}
else if(m==='debtdetail'){const d=getDebt(modalArgs.id);d.base=Number(data.balance)+debtPaid(d.id);showToast('Balance reconciled to your statement')}
else if(m==='addevent'){state.events.push({id:uid(),name:data.name.trim(),date,note:data.note||''});selectedDate=date;calendarDate=parseDay(date);showToast('Added to calendar')}
save();closeModal();render();if(pendingCelebration){const [t,m,emoji]=pendingCelebration;pendingCelebration=null;triggerCelebration(t,m,emoji)}}
function maybeCelebrate(d){const p=percent(debtPaid(d.id),d.base);let threshold=p===100?100:p>=90?90:p>=75?75:p>=50?50:p>=25?25:0;const prev=state.debtCelebrated[d.id]||0;if(threshold>prev){state.debtCelebrated[d.id]=threshold;const msg=threshold===100?`You've paid off ${d.name}!`:threshold>=90?"You're almost at the finish line!":`${threshold}% paid off since we started tracking!`;pendingCelebration=[threshold===100?'WE DID IT!! ✨':'Little win unlocked!',msg,threshold===100?'🎉':'🌷']}}
function triggerCelebration(title,message,emoji){celebration=true;$('#toast-root').innerHTML=`<div class="celebrate"><div class="inside"><div class="big">${emoji}</div><h2>${esc(title)}</h2><p>${esc(message)}</p><p class="small muted">Every payment is bringing you closer to your big adventures.</p><button class="solid full" data-action="closecelebration">Keep going ♡</button></div></div>`}
function attachEvents(){}
function onclick(e){let node=e.target.closest('[data-action],[data-nav],[data-open],[data-mode],[data-day],[data-task],[data-billsfilter],[data-close-overlay]');if(!node)return;
if(node.dataset.closeOverlay&&e.target===node){closeModal();return}
if(node.dataset.nav){navigate(node.dataset.nav);return}
if(node.dataset.open){navigate(node.dataset.open);return}
if(node.dataset.mode){mode=node.dataset.mode;render();return}
if(node.dataset.day){selectedDate=node.dataset.day;calendarDate=parseDay(selectedDate);navigate('calendar');return}
if(node.dataset.billsfilter){billsFilter=node.dataset.billsfilter;render();return}
if(node.dataset.task){const id=node.dataset.task;if(node.checked&&!state.completedTasks.includes(id))state.completedTasks.push(id);else if(!node.checked)state.completedTasks=state.completedTasks.filter(x=>x!==id);save();render();return}
const a=node.dataset.action,id=node.dataset.id;if(!a)return;
if(a==='undorentcash'){const c=getCycle();if(!confirm('Undo this recorded rent cash withdrawal?'))return;state.rentWithdrawals=(state.rentWithdrawals||[]).filter(w=>w.periodKey!==c.key);save();closeModal();render();showToast('Withdrawal entry undone');return}
if(a==='closemodal'){closeModal();return}if(a==='closecelebration'){$('#toast-root').innerHTML='';celebration=false;return}
if(a==='pickbill'){const preset=billPresets.find(p=>p.key===id);if(!preset)return;const b=state.bills.find(b=>b.active&&(b.id===id||b.name.toLowerCase()===preset.name.toLowerCase()));if(b){openModal('billdetail',{id:b.id});return}modalArgs={templateKey:preset.key};paintModal();return}
if(a==='prevcycle'||a==='nextcycle'){cycleOffset+=a==='prevcycle'?-1:1;render();return}
if(a==='prevmonth'||a==='nextmonth'){calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+(a==='prevmonth'?-1:1),1);selectedDate=iso(calendarDate);render();return}
if(a==='period'){navigate('period');return}
if(a==='deletealloc'){const key=getCycle().key;state.plan[key]=(state.plan[key]||[]).filter(x=>x.id!==id);save();render();return}
if(a==='deletetx'){const t=state.transactions.find(x=>x.id===id);if(!t)return;if(!confirm('Remove this recorded transaction?'))return;if(t.type==='goal')state.goals.find(g=>g.id===t.ref).saved-=t.amount;if(t.type==='withdraw')state.goals.find(g=>g.id===t.ref).saved+=t.amount;state.transactions=state.transactions.filter(x=>x.id!==id);save();showToast('Transaction removed');render();return}
if(a==='delevent'){state.events=state.events.filter(e=>e.id!==id);save();render();return}
if(a==='togglebillpaid'){const b=state.bills.find(b=>b.id===id),d=new Date(),ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,already=state.transactions.find(t=>t.type==='bill'&&t.ref===b.id&&t.date.startsWith(ym));if(already){state.transactions=state.transactions.filter(t=>t.id!==already.id);showToast('Marked unpaid again')}else{state.transactions.push({id:uid(),type:'bill',ref:b.id,amount:b.amount,date:today(),name:b.name,note:`Bill for ${ym}`});showToast('Bill paid and logged ✓')}save();closeModal();render();return}
if(a==='deactivatebill'){if(!confirm('Remove this recurring bill from future months? Past transactions remain.'))return;state.bills.find(b=>b.id===id).active=false;save();closeModal();render();return}
if(a==='export'){const blob=new Blob([JSON.stringify({app:'Our Next Chapter',exported:new Date().toISOString(),state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`our-next-chapter-backup-${today()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);showToast('Backup file exported');return}
if(a==='import'){const file=$('#backupInput');file?.click();return}
openModal(a,id?{id}:{})}
document.addEventListener('click',onclick);document.addEventListener('submit',e=>{if(e.target.id==='modalform')onSubmit(e)});document.addEventListener('change',async e=>{if(e.target.id!=='backupInput')return;try{const file=e.target.files?.[0];if(!file)return;const loaded=JSON.parse(await file.text());const s=loaded.state||loaded;if(!Array.isArray(s.bills)||!Array.isArray(s.transactions)||!Array.isArray(s.goals)||!Array.isArray(s.debts))throw Error('Incorrect backup format');if(!confirm('Restore this backup? It will replace current data on this device.'))return;state=s;save();render();showToast('Backup restored successfully')}catch(err){showToast('Could not read this backup file')}e.target.value=''});
render();
})();
